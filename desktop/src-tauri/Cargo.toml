[package]
name = "rea-desktop"
version = "6.5.0"
description = "Desktop UI for REA (Reverse Engineer Anything)"
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "REA"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Set by `cargo build --release`-style packaging so the UI is embedded.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
